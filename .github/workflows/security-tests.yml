name: Security Penetration Tests (OWASP ZAP)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Run automatically every Sunday

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start GovFlow Environment
        run: |
          docker compose up --build -d db backend frontend
          # Give services ample time to start up and seed the database
          sleep 45

      - name: ZAP Full Scan (Frontend)
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: ZAP API Scan (Backend)
        uses: zaproxy/action-api-scan@v0.5.0
        with:
          target: 'http://localhost:8000/openapi.json'
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: '*report.html'
          retention-days: 14
