name: Stress & Performance Tests (k6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start GovFlow Environment
      run: |
        docker compose up --build -d
        sleep 45 

    - name: Run k6 Load Test
      run: |
        docker run --network host -v ${{ github.workspace }}:/app -w /app grafana/k6 run backend/tests/load_test.js

    - name: Upload k6 Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: k6-performance-report
        path: k6-report.html
        retention-days: 14
